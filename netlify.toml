[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

# Proxy rules are written to dist/_redirects from BACKEND_UPSTREAM at build time.
# Set it to the EC2 HTTP origin in Netlify. The browser only uses this Netlify HTTPS origin.

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
