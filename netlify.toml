[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

# Proxy rules are written to dist/_redirects from VITE_API_BASE_URL at build time.
# Set that variable in the Netlify UI. Do not hardcode it here; this file would override the UI.

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
