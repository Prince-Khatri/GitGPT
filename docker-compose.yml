services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.backend
    expose:
      - "8080"
    networks:
      - gitgpt
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    env_file:
      - ./frontend/.env
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NGINX_ENVSUBST_FILTER: BACKEND_UPSTREAM
      BACKEND_UPSTREAM: backend:8080
    ports:
      - "${HTTP_PORT:-80}:80"
    networks:
      - gitgpt
    restart: unless-stopped

networks:
  gitgpt:
    driver: bridge
