spring.application.name=GitGPT
# DB
spring.datasource.url=${DB_URL}
spring.jpa.properties.hibernate.default_schema=${DB_SCHEMA}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update

# Gemini — server key is optional. Users store their own key in Settings.
spring.ai.google.genai.api-key=${GOOGLE_API_KEY:}
spring.ai.google.genai.chat.model=gemini-3.5-flash-lite
spring.ai.model.embedding.text=google-genai
spring.ai.google.genai.embedding.api-key=${GOOGLE_API_KEY:}
spring.ai.google.genai.embedding.text.model=gemini-embedding-001
gitgpt.gemini.server-api-key=${GOOGLE_API_KEY:}
gitgpt.gemini.default-chat-model=gemini-3.5-flash-lite
gitgpt.gemini.default-embedding-model=gemini-embedding-001
gitgpt.gemini.embedding-dimensions=1536
spring.ai.google.genai.embedding.text.dimensions=1536
spring.ai.google.genai.embedding.text.task-type=RETRIEVAL_DOCUMENT

# pgvector (HNSW max 2000 dims; Gemini default 3072, so pin 1536)
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.dimensions=1536
spring.ai.vectorstore.pgvector.schema-name=${DB_SCHEMA}
spring.ai.vectorstore.pgvector.table-name=vector_store

# Index caps — never run on /home repo list/sync
gitgpt.index.max-files=400
gitgpt.index.max-file-bytes=262144
gitgpt.index.max-total-bytes=8388608
gitgpt.index.embed-batch-size=32
gitgpt.index.chunk-lines=100
gitgpt.index.chunk-overlap-lines=20
gitgpt.index.embed-max-attempts=4

gitgpt.ask.vector-top-k=12
gitgpt.ask.keyword-limit=40
gitgpt.ask.packed-chunks=5
gitgpt.ask.max-context-tokens=2500
gitgpt.ask.max-question-chars=2000
gitgpt.ask.max-history-messages=8
gitgpt.ask.max-history-chars=400

# AES-256-GCM for Users.accessToken and Users.geminiApiKey (enc:v2, bound to GitHub id).
# Override in prod with GITGPT_TOKEN_ENCRYPTION_KEY. The default is local-only.
#   openssl rand -base64 32
gitgpt.security.token-encryption-key=${GITGPT_TOKEN_ENCRYPTION_KEY:gitgpt-local-dev-only-not-for-prod}
gitgpt.security.token-cache-ttl-minutes=20
gitgpt.security.ask-rate-limit=30
gitgpt.security.ask-rate-window-seconds=600
gitgpt.security.index-rate-limit=6
gitgpt.security.index-rate-window-seconds=900

# React UI origin. After GitHub login, Spring redirects here.
gitgpt.ui.frontend-origin=${FRONTEND_ORIGIN:http://localhost:5173}

# GitHub OAuth — callback must match the React origin (Vite proxies /login/oauth2 to :8080):
#   Homepage URL:               http://localhost:5173
#   Authorization callback URL: http://localhost:5173/login/oauth2/code/github
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.client-name=GitHub
spring.security.oauth2.client.registration.github.scope=read:user,user:email,repo
spring.security.oauth2.client.registration.github.redirect-uri=${GITGPT_OAUTH_REDIRECT_URI:http://localhost:5173/login/oauth2/code/github}

server.error.include-message=always
server.error.include-exception=always
server.error.whitelabel.enabled=false

